name: backend-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgres-redis-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: piedlens
          POSTGRES_USER: piedlens
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U piedlens -d piedlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_ENV: test
      DJANGO_SECRET_KEY: ci-only-test-key
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost
      POSTGRES_DB: piedlens
      POSTGRES_USER: piedlens
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Bandit security scan
        run: |
          python -m pip install bandit==1.8.6
          bandit -r src -ll
      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit==2.9.0
          pip-audit -r requirements.txt
      - name: Run complete suite on PostgreSQL and Redis
        run: python manage.py test tests --settings=config.ci_settings -v 1

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2.3.9
